name: Docker Build and Validation

# Build and test Docker images on pull requests and main branch
on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pdf-rag-assistant:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Test Docker image
        run: |
          # Start container in background
          docker run -d --name test-app -p 8000:8000 \
            -e OLLAMA_BASE_URL=http://host.docker.internal:11434 \
            pdf-rag-assistant:latest

          # Wait for health check
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

          # Run basic health check
          curl -f http://localhost:8000/health | jq .

          # Cleanup
          docker stop test-app
          docker rm test-app

      - name: Validate Docker Compose configurations
        run: |
          # Validate standard docker-compose
          docker compose -f docker-compose.yml config

          # Validate GPU docker-compose (will fail without GPU runtime, but config should be valid)
          docker compose -f docker-compose.gpu.yml config || true

      - name: Docker image meta information
        run: |
          docker images pdf-rag-assistant:latest
          docker inspect pdf-rag-assistant:latest | jq '.[0].Config'

  push:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
