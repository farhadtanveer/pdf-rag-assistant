# Docker Compose configuration for PDF RAG Assistant (GPU deployment)
# This configuration uses vLLM for GPU-accelerated model serving
# Requires NVIDIA GPU with CUDA support and nvidia-docker runtime

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-rag-app-gpu
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - VLLM_BASE_URL=http://vllm:8000
      - MODEL_PROVIDER=vllm
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - LLM_MODEL=${LLM_MODEL:-meta-llama/Llama-3-8b}
      - CHUNK_SIZE=${CHUNK_SIZE:-800}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-150}
      - TOP_K_CHUNKS=${TOP_K_CHUNKS:-5}
      - GPU_ENABLED=true
      - GPU_BATCH_SIZE_EMBEDDINGS=${GPU_BATCH_SIZE_EMBEDDINGS:-64}
      - GPU_BATCH_SIZE_LLM=${GPU_BATCH_SIZE_LLM:-8}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-8}
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/chroma_db:/app/data/chroma_db
    depends_on:
      - vllm
    restart: unless-stopped
    networks:
      - pdf-rag-gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # vLLM Service (GPU-Accelerated Model Serving)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: pdf-rag-vllm
    ports:
      - "8001:8000"
    environment:
      - MODEL=${LLM_MODEL:-meta-llama/Llama-3-8b}
      - GPU_MEMORY_UTILIZATION=0.9
      - MAX_MODEL_LEN=4096
      - DTYPE=half
    volumes:
      - vllm_cache:/root/.cache
    restart: unless-stopped
    networks:
      - pdf-rag-gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  pdf-rag-gpu-network:
    driver: bridge

volumes:
  vllm_cache:
    driver: local
